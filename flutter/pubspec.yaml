name: typing_master_mobile_pro
description: A premium typing master training app for iOS and Android built on Flutter and Firebase.
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  provider: ^6.0.3

  # Firebase Backend Suite
  firebase_core: ^2.15.0
  firebase_auth: ^4.7.0
  cloud_firestore: ^4.8.0
  google_sign_in: ^6.1.4

  # Styling & Aesthetics
  google_fonts: ^4.0.4
  flutter_spinkit: ^5.2.0
  percent_indicator: ^4.0.1
  line_icons: ^2.0.3
  flame: ^1.8.1 # For space shooter & falling letters mobile typing games
  audioplayers: ^4.0.1

  # Native APIs & Sensornets
  flutter_vibrate: ^1.3.0
  shared_preferences: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
